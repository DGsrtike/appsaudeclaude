async function loadCore() {
  cache = {};
  const todos = await idbTodos();
  const meus = todos.filter(x => String(x.k).indexOf((uid || "anon") + "|") === 0);
  meus.forEach(x => {
    if (x.rec && !x.rec.apagado) cache[String(x.k).slice((uid || "anon").length + 1)] = x.rec.v;
  });
  await contarPendentes();
  if (!sb || typeof navigator !== "undefined" && navigator.onLine === false) return;
  try {
    const {
      data,
      error
    } = await sb.from("dados").select("chave,valor").in("chave", CORE_KEYS);
    if (!error && data) {
      for (const r of data) {
        const local = await idbGet(escopo(r.chave));
        if (local && local.sujo) continue; /* alterações locais por enviar ganham */
        cache[r.chave] = r.valor;
        await idbPut(escopo(r.chave), {
          v: r.valor,
          sujo: false
        });
      }
    }
  } catch (e) {/* offline: segue com o espelho local */}
  flush();
}
const store = {
  async get(key) {
    if (key in cache) return cache[key];
    const local = await idbGet(escopo(key));
    if (local && !local.apagado) {
      cache[key] = local.v;
      return local.v;
    }
    if (!sb || typeof navigator !== "undefined" && navigator.onLine === false) return null;
    try {
      const {
        data
      } = await sb.from("dados").select("valor").eq("chave", key).maybeSingle();
      const v = data ? data.valor : null;
      cache[key] = v;
      if (v != null) await idbPut(escopo(key), {
        v,
        sujo: false
      });
      return v;
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    cache[key] = value;
    await idbPut(escopo(key), {
      v: value,
      sujo: true
    });
    await contarPendentes();
    agendarFlush();
  },
  async del(key) {
    delete cache[key];
    await idbPut(escopo(key), {
      v: null,
      sujo: true,
      apagado: true
    });
    await contarPendentes();
    agendarFlush();
  },
  async list(prefix) {
    const set = {};
    Object.keys(cache).forEach(k => {
      if (k.indexOf(prefix) === 0) set[k] = 1;
    });
    const todos = await idbTodos();
    todos.forEach(x => {
      const k = String(x.k);
      if (k.indexOf((uid || "anon") + "|") !== 0) return;
      const chave = k.slice((uid || "anon").length + 1);
      if (chave.indexOf(prefix) === 0) {
        if (x.rec && x.rec.apagado) delete set[chave];else set[chave] = 1;
      }
    });
    if (sb && (typeof navigator === "undefined" || navigator.onLine !== false)) {
      try {
        const {
          data
        } = await sb.from("dados").select("chave").like("chave", prefix + "%");
        if (data) for (const r of data) {
          const local = await idbGet(escopo(r.chave));
          if (local && local.apagado) continue;
          set[r.chave] = 1;
        }
      } catch (e) {}
    }
    return Object.keys(set);
  }
};

function dayKey(d = new Date()) {

function addDaysKey(key, n) {

function daysBetween(a, b) {

    [y2, m2, d2] = b.split("-").map(Number);

function sleepHours(bed, wake) {
  if (!bed || !wake) return null;
  const [bh, bm] = bed.split(":").map(Number),
    [wh, wm] = wake.split(":").map(Number);
  let start = bh * 60 + bm,
    end = wh * 60 + wm;
  if (end <= start) end += 24 * 60;
  return Math.round((end - start) / 60 * 10) / 10;
}
function minusHours(hhmm, hours) {

  const [h, m] = hhmm.split(":").map(Number);

  while (t < 0) t += 1440;

function readImage(file, maxDim = 1280, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let {
        width,
        height
      } = img;
      if (Math.max(width, height) > maxDim) {
        const s = maxDim / Math.max(width, height);
        width = Math.round(width * s);
        height = Math.round(height * s);
      }
      const cv = document.createElement("canvas");
      cv.width = width;
      cv.height = height;
      cv.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}
function imgSize(u) {

    const i = new Image();
    i.onload = () => res({
      w: i.width,
      h: i.height

    i.onerror = () => res({
      w: 1,
      h: 1
    });
    i.src = u;
  });
}

  return Math.round(e.rpe * min);
}
function cargasSerie(days, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = daysAgoKey(i);
    out.push({

  }

}
function metricasCarga(days) {

  const s7 = s28.slice(-7),
    vals7 = s7.map(x => x.v).filter(x => x != null);
  const semana = vals7.length ? sum(vals7) : null;
  const aguda = vals7.length >= 3 ? sum(vals7) / 7 : null;
  const cronica = vals28.length >= 10 ? sum(vals28) / 28 : null;
  const acwr = aguda != null && cronica ? Math.round(aguda / cronica * 100) / 100 : null;
  const mono = vals7.length >= 4 && sd(vals7) ? Math.round(avg(vals7) / sd(vals7) * 100) / 100 : null;
  const strain = semana != null && mono != null ? Math.round(semana * mono) : null;
  const semanaAnterior = s28.slice(-14, -7).map(x => x.v).filter(x => x != null);
  const deltaSemana = semana != null && semanaAnterior.length >= 3 ? Math.round((semana - sum(semanaAnterior)) / Math.max(1, sum(semanaAnterior)) * 100) : null;
  return {
    serie28: s28,
    serie7: s7,
    semana,
    aguda,
    cronica,
    acwr,
    mono,
    strain,
    deltaSemana
  };
}

    d: "A carga está a subir a um ritmo que o corpo aguenta."
  };
}

/* ----------------------- Sono e dívida --------------------------- */
function metricasSono(days, alvo) {
  const A = alvo || 8;
  const ks = [];
  for (let i = 13; i >= 0; i--) ks.push(daysAgoKey(i));
  const horas = ks.map(k => days[k] && days[k].morning ? days[k].morning.sono : null);
  const val = horas.filter(x => x != null);
  const debt7 = ks.slice(-7).map(k => days[k] && days[k].morning ? days[k].morning.sono : null).filter(x => x != null).reduce((a, h) => a + Math.max(0, A - h), 0);
  const debt14 = val.reduce((a, h) => a + Math.max(0, A - h), 0);
  const curtas7 = ks.slice(-7).map(k => days[k] && days[k].morning ? days[k].morning.sono : null).filter(x => x != null && x < 7.5).length;
  const regularidade = (() => {
    const horasDeitar = ks.map(k => days[k] && days[k].morning ? days[k].morning.deitar : null).filter(Boolean).map(t => {
      const [h, m] = t.split(":").map(Number);
      let v = h * 60 + m;
      if (v < 720) v += 1440;
      return v;
    });
    const s = sd(horasDeitar);
    return s == null ? null : Math.round(s);
  })();
  return {
    horas,
    ks,
    media: avg(val),
    debt7: Math.round(debt7 * 10) / 10,
    debt14: Math.round(debt14 * 10) / 10,
    curtas7,
    regularidade,
    n: val.length
  };
}

/* ------------------------- Hidratação ---------------------------- */
function calcHidratacao(h) {
  if (!h || h.antes == null || h.depois == null) return null;
  const bebido = h.bebidoMl || 0,
    min = h.minutos || 90;
  const perdaKg = h.antes - h.depois;
  const pct = Math.round(perdaKg / h.antes * 1000) / 10;
  const suorL = perdaKg + bebido / 1000;
  const taxa = Math.round(suorL / (min / 60) * 100) / 100;
  const repor = Math.max(0, Math.round(perdaKg * 1500));
  let banda;
  if (pct < 1) banda = {
    c: C.good,
    t: "Bem hidratado",
    d: "Perdeste menos de 1% do peso. Continua assim."
  };else if (pct < 2) banda = {
    c: C.amber,
    t: "Desidratação ligeira",
    d: "Já começa a custar no fim do treino. Bebe mais durante a sessão."
  };else banda = {
    c: C.warn,
    t: "Desidratação significativa",
    d: "Acima de 2% o desempenho cai claramente. Aumenta os líquidos durante o treino."
  };
  return {
    pct,
    taxa,
    repor,
    suorL: Math.round(suorL * 100) / 100,
    banda
  };
}

/* ------------------------ Isotretinoína -------------------------- */
function isoInfo(cfg) {
  if (!cfg || !cfg.isoStart) return null;
  const hoje = dayKey();
  const dias = daysBetween(cfg.isoStart, hoje);
  if (dias == null || dias < 0) return null;
  const fim = addDaysKey(cfg.isoStart, Math.round((cfg.isoMeses || 6) * 30.44));
  const restam = daysBetween(hoje, fim);
  const peso = cfg.isoPesoKg || cfg.peso || 61;
  const cumulativa = Math.round((dias + 1) * (cfg.isoDoseMg || 20) / peso);
  const alvoMin = 120,
    alvoMax = 150;
  const previstaFinal = Math.round((daysBetween(cfg.isoStart, fim) || 0) * (cfg.isoDoseMg || 20) / peso);
  const proximaAnalise = cfg.isoUltimaAnalise ? addDaysKey(cfg.isoUltimaAnalise, cfg.isoIntervaloAnalises || 60) : null;
  const diasAteAnalise = proximaAnalise ? daysBetween(hoje, proximaAnalise) : null;
  return {
    dias,
    fim,
    restam,
    cumulativa,
    alvoMin,
    alvoMax,
    previstaFinal,
    pct: clamp(Math.round(cumulativa / alvoMax * 100), 0, 100),
    proximaAnalise,
    diasAteAnalise
  };
}

    });

  /* Análises fora de intervalo */
  const ult = (analyses || []).slice().sort((a, b) => a.date < b.date ? 1 : -1)[0];
  if (ult && ult.params) {
    const fora = ult.params.map(p => ({
      p,
      r: avaliaValor(p.n, p.v)

  /* Pós-op */
  const po = posOpInfo(cfg);
  if (po && po.dias <= 14) A.push({

    icon: "op",

  });
  const ordem = {
    alta: 0,
    media: 1,
    info: 2
  };
  return A.sort((a, b) => ordem[a.sev] - ordem[b.sev]);
}

/* -------------------------- Correlações -------------------------- */
function correlacoes(days, cfg) {
  const out = [];
  const ks = Object.keys(days).sort();
  const baseHR = avg(ks.map(k => days[k].morning ? days[k].morning.fcRepouso : null));
  const R = k => readinessScore(days[k] && days[k].morning, baseHR);
  /* 1. Sono curto -> prontidão do próprio dia */
  const curto = [],
    longo = [];
  ks.forEach(k => {
    const m = days[k].morning;
    const r = R(k);
    if (!m || m.sono == null || r == null) return;
    if (m.sono < 7) curto.push(r);else if (m.sono >= 8) longo.push(r);
  });
  if (curto.length >= 3 && longo.length >= 3) {
    const d = Math.round(avg(longo) - avg(curto));
    out.push({
      t: "Sono ⇢ prontidão",
      v: `${d > 0 ? "+" : ""}${d} pontos`,
      d: `Nos dias em que dormes 8 h ou mais, a tua prontidão é em média ${Math.abs(d)} pontos ${d > 0 ? "mais alta" : "mais baixa"} do que quando dormes menos de 7 h.`,
      n: curto.length + longo.length,
      c: d >= 8 ? C.good : C.teal
    });
  }
  /* 2. RPE alto -> dores no dia seguinte */
  const apos = [],
    normal = [];
  ks.forEach(k => {
    const e = days[k].evening;
    const kn = addDaysKey(k, 1);
    const mn = days[kn] && days[kn].morning;
    if (!e || e.rpe == null || !mn || mn.dores == null) return;
    (e.rpe >= 8 ? apos : normal).push(mn.dores);
  });
  if (apos.length >= 3 && normal.length >= 3) {
    const d = Math.round((avg(apos) - avg(normal)) * 10) / 10;
    out.push({
      t: "Treino duro ⇢ dores no dia seguinte",
      v: `${d > 0 ? "+" : ""}${d} / 5`,
      d: `Depois de sessões com RPE 8 ou mais, acordas com ${Math.abs(d)} pontos ${d > 0 ? "mais" : "menos"} de dores do que o habitual.`,
      n: apos.length + normal.length,
      c: C.amber
    });
  }
  /* 3. Dia de descanso -> prontidão seguinte */
  const dep = [],
    semDesc = [];
  ks.forEach(k => {
    const e = days[k].evening;
    const kn = addDaysKey(k, 1);
    const r = R(kn);
    if (!e || !e.treino || r == null) return;
    (e.treino === "Descanso" ? dep : semDesc).push(r);
  });
  if (dep.length >= 3 && semDesc.length >= 3) {
    const d = Math.round(avg(dep) - avg(semDesc));
    out.push({
      t: "Dia de descanso ⇢ prontidão seguinte",
      v: `${d > 0 ? "+" : ""}${d} pontos`,
      d: `A manhã a seguir a um dia de descanso vale-te ${Math.abs(d)} pontos ${d > 0 ? "a mais" : "a menos"} de prontidão.`,
      n: dep.length + semDesc.length,
      c: C.good
    });
  }
  /* 4. Protocolo/creatina não aplicável — hidratação vs RPE */
  return out;
}

/* --------------------- Protocolo — adesão ------------------------ */
function adesaoProtocolo(proto, nDias) {
  if (!proto || !proto.itens || !proto.itens.length) return null;
  const ativos = proto.itens.filter(i => !i.off);
  if (!ativos.length) return null;
  let tot = 0,
    feitos = 0;
  for (let i = 0; i < nDias; i++) {
    const k = daysAgoKey(i);
    const dd = proto.done && proto.done[k] || null;
    if (i > 0 && !dd) {
      tot += ativos.length;
      continue;
    }
    if (i === 0 && !dd) continue;
    tot += ativos.length;
    feitos += ativos.filter(it => dd.indexOf(it.id) >= 0).length;
  }
  if (!tot) return null;
  return Math.round(feitos / tot * 100);
}
function streakProtocolo(proto) {
  if (!proto || !proto.done) return 0;
  const ativos = (proto.itens || []).filter(i => !i.off).length;
  if (!ativos) return 0;
  let s = 0;
  for (let i = 0; i < 200; i++) {
    const k = daysAgoKey(i);
    const dd = proto.done[k];
    const ok = dd && dd.length >= Math.ceil(ativos * 0.7);
    if (!ok) {
      if (i === 0) continue;
      break;
    }
    s++;
  }
  return s;
}
function streakRegisto(days) {
  let s = 0;
  for (let i = 0; i < 400; i++) {
    const k = daysAgoKey(i);
    const d = days[k];
    const ok = d && (d.morning || d.evening || d.body);
    if (!ok) {
      if (i === 0) continue;
      break;
    }
    s++;
  }
  return s;
}

  }
  return byDay;
}
