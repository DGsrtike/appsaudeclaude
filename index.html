emana-sum(semanaAnterior))/Math.max(1,sum(semanaAnterior))*100):null;return{serie28:s28,serie7:s7,semana,aguda,cronica,acwr,mono,strain,deltaSemana};}function bandaAcwr(a){if(a==null)return{c:C.muted,t:"Sem dados suficientes",d:"Regista o RPE e a duração dos treinos durante ~2 semanas."};if(a>1.5)return{c:C.warn,t:"Zona de risco",d:"Subiste a carga depressa demais. É aqui que aparecem as lesões e as constipações."};if(a>1.3)return{c:C.amber,t:"A subir rápido",d:"Estás acima do teu normal. Cuidado com mais uma semana assim."};if(a<0.8)return{c:C.teal,t:"Em descarga",d:"Carga abaixo do habitual — normal em taper, recuperação ou pós-operatório."};return{c:C.good,t:"Zona ideal",d:"A carga está a subir a um ritmo que o corpo aguenta."};}/* ----------------------- Sono e dívida --------------------------- */function metricasSono(days,alvo){const A=alvo||8;const ks=[];for(let i=13;i>=0;i--)ks.push(daysAgoKey(i));const horas=ks.map(k=>days[k]&&days[k].morning?days[k].morning.sono:null);const val=horas.filter(x=>x!=null);const debt7=ks.slice(-7).map(k=>days[k]&&days[k].morning?days[k].morning.sono:null).filter(x=>x!=null).reduce((a,h)=>a+Math.max(0,A-h),0);const debt14=val.reduce((a,h)=>a+Math.max(0,A-h),0);const curtas7=ks.slice(-7).map(k=>days[k]&&days[k].morning?days[k].morning.sono:null).filter(x=>x!=null&&x<7.5).length;const regularidade=(()=>{const horasDeitar=ks.map(k=>days[k]&&days[k].morning?days[k].morning.deitar:null).filter(Boolean).map(t=>{const[h,m]=t.split(":").map(Number);let v=h*60+m;if(v<720)v+=1440;return v;});const s=sd(horasDeitar);return s==null?null:Math.round(s);})();return{horas,ks,media:avg(val),debt7:Math.round(debt7*10)/10,debt14:Math.round(debt14*10)/10,curtas7,regularidade,n:val.length};}/* ------------------------- Hidratação ---------------------------- */function calcHidratacao(h){if(!h||h.antes==null||h.depois==null)return null;const bebido=h.bebidoMl||0,min=h.minutos||90;const perdaKg=h.antes-h.depois;const pct=Math.round(perdaKg/h.antes*1000)/10;const suorL=perdaKg+bebido/1000;const taxa=Math.round(suorL/(min/60)*100)/100;const repor=Math.max(0,Math.round(perdaKg*1500));let banda;if(pct<1)banda={c:C.good,t:"Bem hidratado",d:"Perdeste menos de 1% do peso. Continua assim."};else if(pct<2)banda={c:C.amber,t:"Desidratação ligeira",d:"Já começa a custar no fim do treino. Bebe mais durante a sessão."};else banda={c:C.warn,t:"Desidratação significativa",d:"Acima de 2% o desempenho cai claramente. Aumenta os líquidos durante o treino."};return{pct,taxa,repor,suorL:Math.round(suorL*100)/100,banda};}/* ------------------------ Isotretinoína -------------------------- */function isoInfo(cfg){if(!cfg||!cfg.isoStart)return null;const hoje=dayKey();const dias=daysBetween(cfg.isoStart,hoje);if(dias==null||dias<0)return null;const fim=addDaysKey(cfg.isoStart,Math.round((cfg.isoMeses||6)*30.44));const restam=daysBetween(hoje,fim);const peso=cfg.isoPesoKg||cfg.peso||61;const cumulativa=Math.round((dias+1)*(cfg.isoDoseMg||20)/peso);const alvoMin=120,alvoMax=150;const previstaFinal=Math.round((daysBetween(cfg.isoStart,fim)||0)*(cfg.isoDoseMg||20)/peso);const proximaAnalise=cfg.isoUltimaAnalise?addDaysKey(cfg.isoUltimaAnalise,cfg.isoIntervaloAnalises||60):null;const diasAteAnalise=proximaAnalise?daysBetween(hoje,proximaAnalise):null;return{dias,fim,restam,cumulativa,alvoMin,alvoMax,previstaFinal,pct:clamp(Math.round(cumulativa/alvoMax*100),0,100),proximaAnalise,diasAteAnalise};}/* --------------------- Pós-operatório (ORL) ---------------------- */const MARCOS_POSOP=[{d:0,t:"Cirurgia",x:"Adenoamigdalectomia + turbinectomia inferior."},{d:1,t:"Dias 1–3 · líquidos e frio",x:"Hidratação é o mais importante. Analgesia certinha, mesmo sem dor."},{d:4,t:"Dias 4–9 · o pior da dor",x:"As crostas formam-se e doem, muitas vezes com dor de ouvido reflexa. É normal."},{d:10,t:"Dias 10–14 · crostas a cair",x:"Janela de maior risco de hemorragia tardia. Sem esforço físico."},{d:15,t:"2–3 semanas · voltar ao movimento",x:"Retoma leve — >days[k].body&&days[k].body.peso!=null).sort();if(bks.length>=2){const ult=days[bks[bks.length-1]].body.peso;const recentes=bks.filter(k=>k>=daysAgoKey(10));if(recentes.length>=2){const prim=days[recentes[0]].body.peso;const dpct=(ult-prim)/prim*100;if(dpct<=-2.5)A.push({sev:"alta",icon:"weight",t:`Perdeste ${r1(Math.abs(ult-prim))} kg em poucos dias`,d:`${r1(dpct)}% do peso corporal.`,acao:"Numa fase de treino e de pós-operatório, isto costuma ser calorias a menos. Vale a pena falares com o Dr. Milheiro."});}}/* Isotretinoína — análises de controlo */const iso=isoInfo(cfg);if(iso&&iso.diasAteAnalise!=null&&iso.diasAteAnalise<=7){A.push({sev:iso.diasAteAnalise<0?"alta":"media",icon:"lab",t:iso.diasAteAnalise<0?`Análises de controlo em atraso (${Math.abs(iso.diasAteAnalise)} dias)`:`Análises de controlo dentro de ${iso.diasAteAnalise} dias`,d:"Na isotretinoína vigiam-se transaminases (ALT/AST) e o perfil lipídico, sobretudo triglicéridos.",acao:"Pede a requisição ao Dr. Sérgio Alves e aproveita para juntar ferritina, vitamina D e B12."});}/* Sintomas de isotretinoína repetidos */const sintomasCont={};ks.forEach(k=>{const m=M(k);if(m&&m.sintomas)m.sintomas.forEach(s=>{sintomasCont[s]=(sintomasCont[s]||0)+1;});});["Sangrar do nariz","Humor em baixo","Dores musculares"].forEach(s=>{if((sintomasCont[s]||0)>=4){A.push({sev:s==="Humor em baixo"?"alta":"media",icon:"pill",t:`“${s}” em ${sintomasCont[s]} dias das últimas duas semanas`,d:"Pode estar relacionado com a isotretinoína.",acao:s==="Humor em baixo"?"Alterações de humor na isotretinoína são para comunicar ao dermatologista sem esperar pela próxima consulta — e para falares com os teus pais.":"Regista e leva à próxima consulta de dermatologia."});}});/* Adesão ao protocolo */if(proto&&proto.itens&&proto.itens.length){const ad=adesaoProtocolo(proto,7);if(ad!=null&&ad<60)A.push({sev:"media",icon:"pill",t:`Adesão ao protocolo de ${ad}% esta semana`,d:"O protocolo do Dr. Milheiro só funciona se for tomado com consistência.",acao:"Escolhe os 3 mais importantes e agarra-te a esses primeiro."});}/* Análises fora de intervalo */const ult=(analyses||[]).slice().sort((a,b)=>a.date<b.date?1:-1)[0];if(ult&&ult.params){const fora=ult.params.map(p=>({p,r:avaliaValor(p.n,p.v)})).filter(x=>x.r&&x.r.est!=="normal");if(fora.length)A.push({sev:"media",icon:"lab",t:`${fora.length} valor(es) fora do intervalo nas últimas análises`,d:fora.slice(0,4).map(x=>`${x.p.n} ${x.p.v} (${x.r.est})`).join(" · "),acao:"Vê o separador Análises para o detalhe e leva a lista à consulta."});}/* Pós-op */const po=posOpInfo(cfg);if(po&&po.dias<=14)A.push({sev:"info",icon:"op",t:`Dia ${po.dias} do pós-operatório`,d:po.atual.x,acao:"Sangue vivo pela boca ou pelo nariz, febre alta ou dificuldade em beber: contacto imediato com o Dr. Nuno Marçal ou urgência."});const ordem={alta:0,media:1,info:2};return A.sort((a,b)=>ordem[a.sev]-ordem[b.sev]);}/* -------------------------- Correlações -------------------------- */function correlacoes(days,cfg){const out=[];const ks=Object.keys(days).sort();const baseHR=avg(ks.map(k=>days[k].morning?days[k].morning.fcRepouso:null));const R=k=>readinessScore(days[k]&&days[k].morning,baseHR);/* 1. Sono curto -> prontidão do próprio dia */const curto=[],longo=[];ks.forEach(k=>{const m=days[k].morning;const r=R(k);if(!m||m.sono==null||r==null)return;if(m.sono<7)curto.push(r);else if(m.sono>=8)longo.push(r);});if(curto.length>=3&&longo.length>=3){const d=Math.round(avg(longo)-avg(curto));out.push({t:"Sono ⇢ prontidão",v:`${d>0?"+":""}${d} pontos`,d:`Nos dias em que dormes 8 h ou mais, a tua prontidão é em média ${Math.abs(d)} pontos ${d>0?"mais alta":"mais baixa"} do que quando dormes menos de 7 h.`,n:curto.length+longo.length,c:d>=8?C.good:C.teal});}/* 2. RPE alto -> dores no dia seguinte */const apos=[],normal=[];ks.forEach(k=>{const e=days[k].evening;const kn=addDaysKey(k,1);const mn=days[kn]&&days[kn].morning;if(!e||e.rpe==null||!mn||mn.dores==null)return;(e.rpe>=8?apos:normal).push(mn.dor » não é."},pele:{t:"Sempre igual",x:"Fotografa uma vez por mês, com a mesma luz e à mesma distância, sem filtros. A escala de 0 a 4 é a que os dermatologistas usam. O que interessa é a linha ao longo dos meses."},forca:{t:"Porquê registar",x:"A app calcula a força máxima estimada a partir do peso e das repetições, o que permite comparar séries diferentes. E compara o que puxas com o que empurras — é aí que costuma nascer o problema do ombro."},carga:{t:"Carga é duração × esforço",x:"Preenche a duração e o RPE no fecho do dia e esta secção enche-se sozinha. O número que interessa é o ACWR: entre 0,8 e 1,3 progride-se com menos risco; acima de 1,5 é onde aparecem lesões."},testes:{t:"De 8 em 8 semanas",x:"Faz sempre nas mesmas condições — mesmo sítio, mesma hora, mesmo aquecimento. Só assim a comparação diz alguma coisa. A app avisa-te quando já passou tempo suficiente para repetir."},planear:{t:"Antes de a semana acontecer",x:"Marca as sessões que estão previstas e a app diz-te se a carga que estás a planear é um salto arriscado. É muito mais fácil evitar uma lesão do que tratá-la."},protocolo:{t:"Marca as tomas",x:"Toca em cada item à medida que tomas. A app calcula a adesão real, que é o número que interessa levar à consulta. Em «Isto posso tomar?» podes colar o rótulo de qualquer suplemento antes de o tomares."},analises:{t:"Escreve os valores",x:"Podes fotografar o papel, mas escreve também os valores: é isso que permite comparar ao longo dos anos e marcar a verde ou a vermelho. A app usa intervalos de referência ajustados ao teu sexo."},crises:{t:"Uma linha por crise",x:"Intensidade, duração, o que possa ter contribuído e o que tomaste. Ao fim de um mês a app mostra os gatilhos mais frequentes — e avisa se estiveres a tomar analgésicos demasiados dias."},vacinas:{t:"Fotografa o boletim",x:"Em vez de escreveres tudo, usa «Ler o boletim de vacinas» e fotografa as páginas. A app reconhece as siglas do plano nacional e propõe as datas, que tu confirmas."},agenda:{t:
